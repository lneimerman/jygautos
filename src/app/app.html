<header class="site-header">
  <div class="container">
    <a class="brand" routerLink="/" aria-label="JYG Autos y Más, inicio">
      @if (logoOk()) {
        <img class="brand-logo" src="logo.png" alt="" (error)="logoOk.set(false)" />
        <span class="brand-name">JYG Autos y Más</span>
      } @else {
        <span class="plate">JYG</span>
        <span class="brand-name">Autos y Más</span>
      }
    </a>
    <nav class="nav" aria-label="Principal">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
      <a routerLink="/autos" routerLinkActive="active">Vehículos</a>
      <a routerLink="/empresa" routerLinkActive="active">Empresa</a>
      <a routerLink="/contacto" routerLinkActive="active">Contacto</a>
    </nav>
  </div>
</header>

<router-outlet />

<footer class="site-footer">
  <div class="container">
    <strong>JYG Autos y Más</strong>
    <span>
      <a href="https://www.google.com/maps/search/?api=1&query=Lacarra+1531+CABA" target="_blank" rel="noopener">Lacarra 1531, CABA</a>
      <a href="https://www.instagram.com/jygautosymas" target="_blank" rel="noopener">&#64;jygautosymas</a>
    </span>
  </div>
</footer>
